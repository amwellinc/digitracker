name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── 1. Build & Deploy Frontend to GitHub Pages ──────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GHL_CLIENT_ID: ${{ secrets.VITE_GHL_CLIENT_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_STRIPE_BASIC_PRICE_ID: ${{ secrets.VITE_STRIPE_BASIC_PRICE_ID }}
          VITE_STRIPE_BUSINESS_PRICE_ID: ${{ secrets.VITE_STRIPE_BUSINESS_PRICE_ID }}
          VITE_STRIPE_PROFESSIONAL_PRICE_ID: ${{ secrets.VITE_STRIPE_PROFESSIONAL_PRICE_ID }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  # ── 2. Deploy Supabase Edge Functions & Migrations ──────────────────────────
  # Cleanly SKIPPED (not silently green) if SUPABASE_ACCESS_TOKEN isn't set.
  # Once it is set, every step below runs for real and a genuine failure shows
  # up as a genuine red X — nothing here is allowed to fail silently anymore.
  supabase:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check SUPABASE_ACCESS_TOKEN is configured
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set as a repo secret — skipping all Supabase deploy steps."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.configured == 'true'
        with:
          version: latest

      - name: Link Supabase project
        if: steps.check.outputs.configured == 'true'
        run: supabase link --project-ref mllrjejqyddgaxxtjsqf

      - name: Apply database migrations
        if: steps.check.outputs.configured == 'true'
        run: supabase db push

      - name: Set GHL edge function secrets
        if: steps.check.outputs.configured == 'true'
        run: |
          supabase secrets set \
            GHL_CLIENT_ID="${{ secrets.GHL_CLIENT_ID }}" \
            GHL_CLIENT_SECRET="${{ secrets.GHL_CLIENT_SECRET }}" \
            GHL_WEBHOOK_SECRET="${{ secrets.GHL_WEBHOOK_SECRET }}"

      # Deploys every function under supabase/functions/ automatically — a
      # named step per function (the old approach) silently deploys nothing
      # for any function whose step was forgotten, which is exactly what
      # happened to capture-ip and provision-subscription: CI stayed green,
      # the frontend shipped calling them, and both 404'd in production
      # until this loop replaced the fixed list.
      #
      # Functions called directly by external services (webhooks, OAuth
      # callbacks) can't supply a Supabase session JWT, so they deploy with
      # --no-verify-jwt — the signature/state check inside each one is the
      # real auth boundary for those. Every other function is only ever
      # called from the app itself (at minimum with the anon key, which is
      # itself a valid JWT) and deploys with default JWT verification.
      - name: Deploy Edge Functions
        if: steps.check.outputs.configured == 'true'
        run: |
          NO_VERIFY_JWT="ghl-oauth-callback ghl-webhook stripe-webhook"
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            if [ "$fn" = "_shared" ]; then continue; fi
            if echo "$NO_VERIFY_JWT" | grep -qw "$fn"; then
              echo "::group::Deploy $fn (--no-verify-jwt)"
              supabase functions deploy "$fn" --no-verify-jwt
            else
              echo "::group::Deploy $fn"
              supabase functions deploy "$fn"
            fi
            echo "::endgroup::"
          done
